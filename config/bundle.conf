# =============================================================================
#  Prometheus-bundle - Configuration centrale
# =============================================================================
#  Ce fichier est lu par tous les scripts (00, 01, 99).
#  Toute variable peut être surchargée par l'environnement, ex. :
#      PROMETHEUS_VERSION=3.5.0 ./01_installation.sh
# =============================================================================

# --- Versions ----------------------------------------------------------------
PROMETHEUS_VERSION="${PROMETHEUS_VERSION:-3.5.0}"
ALERTMANAGER_VERSION="${ALERTMANAGER_VERSION:-0.28.1}"

# --- Source des archives -----------------------------------------------------
# Les archives sont d'abord recherchées dans le répertoire packages/ du bundle
# (mode hors-ligne). Si elles sont absentes et que OFFLINE=no, elles sont
# téléchargées depuis GitHub.
OFFLINE="${OFFLINE:-no}"
DOWNLOAD_BASE_URL="${DOWNLOAD_BASE_URL:-https://github.com/prometheus}"
# Vérification SHA256 des archives (yes/no). Nécessite le fichier
# sha256sums.txt (téléchargé ou placé dans packages/<composant>-sha256sums.txt).
VERIFY_CHECKSUM="${VERIFY_CHECKSUM:-yes}"

# --- Comptes système ---------------------------------------------------------
PROMETHEUS_USER="${PROMETHEUS_USER:-prometheus}"
PROMETHEUS_GROUP="${PROMETHEUS_GROUP:-prometheus}"
ALERTMANAGER_USER="${ALERTMANAGER_USER:-alertmanager}"
ALERTMANAGER_GROUP="${ALERTMANAGER_GROUP:-alertmanager}"

# --- Arborescence ------------------------------------------------------------
BIN_DIR="${BIN_DIR:-/usr/local/bin}"
PROMETHEUS_CONF_DIR="${PROMETHEUS_CONF_DIR:-/etc/prometheus}"
PROMETHEUS_DATA_DIR="${PROMETHEUS_DATA_DIR:-/var/lib/prometheus}"
ALERTMANAGER_CONF_DIR="${ALERTMANAGER_CONF_DIR:-/etc/alertmanager}"
ALERTMANAGER_DATA_DIR="${ALERTMANAGER_DATA_DIR:-/var/lib/alertmanager}"
SYSTEMD_DIR="${SYSTEMD_DIR:-/etc/systemd/system}"
LOG_DIR="${LOG_DIR:-/var/log/prometheus-bundle}"

# --- Réseau ------------------------------------------------------------------
PROMETHEUS_LISTEN_ADDRESS="${PROMETHEUS_LISTEN_ADDRESS:-0.0.0.0}"
PROMETHEUS_PORT="${PROMETHEUS_PORT:-9090}"
ALERTMANAGER_LISTEN_ADDRESS="${ALERTMANAGER_LISTEN_ADDRESS:-0.0.0.0}"
ALERTMANAGER_PORT="${ALERTMANAGER_PORT:-9093}"
# Ouvrir les ports dans le pare-feu local (firewalld ou ufw) : yes/no
OPEN_FIREWALL="${OPEN_FIREWALL:-no}"

# --- Paramètres Prometheus ---------------------------------------------------
PROMETHEUS_RETENTION_TIME="${PROMETHEUS_RETENTION_TIME:-15d}"
PROMETHEUS_RETENTION_SIZE="${PROMETHEUS_RETENTION_SIZE:-0}"   # 0 = illimité
PROMETHEUS_SCRAPE_INTERVAL="${PROMETHEUS_SCRAPE_INTERVAL:-15s}"
PROMETHEUS_EVALUATION_INTERVAL="${PROMETHEUS_EVALUATION_INTERVAL:-15s}"
# Libellé "cluster" ajouté à toutes les séries (external_labels)
PROMETHEUS_CLUSTER_LABEL="${PROMETHEUS_CLUSTER_LABEL:-$(hostname -s 2>/dev/null || echo prometheus)}"

# --- Paramètres Alertmanager -------------------------------------------------
ALERTMANAGER_DATA_RETENTION="${ALERTMANAGER_DATA_RETENTION:-120h}"
# Récepteur par défaut : webhook ou email
ALERTMANAGER_RECEIVER_TYPE="${ALERTMANAGER_RECEIVER_TYPE:-webhook}"
ALERTMANAGER_WEBHOOK_URL="${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:5001/}"
ALERTMANAGER_SMTP_SMARTHOST="${ALERTMANAGER_SMTP_SMARTHOST:-localhost:25}"
ALERTMANAGER_SMTP_FROM="${ALERTMANAGER_SMTP_FROM:-alertmanager@localhost}"
ALERTMANAGER_EMAIL_TO="${ALERTMANAGER_EMAIL_TO:-root@localhost}"

# --- Vérifications préliminaires ---------------------------------------------
# Espace disque minimal (en Mo) requis sur le répertoire de données
MIN_DISK_MB="${MIN_DISK_MB:-2048}"
# Mémoire minimale (en Mo)
MIN_MEMORY_MB="${MIN_MEMORY_MB:-1024}"
